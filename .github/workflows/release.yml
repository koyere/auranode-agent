name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # crear el release y subir assets
  packages: write   # publicar imágenes en GHCR

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # GoReleaser necesita el historial completo y los tags

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Verify source and installer
        run: |
          go test ./...
          go vet ./...
          go test -race ./...
          bash -n install.sh
          shellcheck install.sh
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release notes = the top (current) section of CHANGELOG.md, so the GitHub
      # release body is the well-defined, human-written changelog (not raw commits).
      # Written OUTSIDE the repo so the working tree stays clean (GoReleaser requires it).
      - name: Extract release notes
        run: |
          awk '/^## \[/{n++; if(n==1) next} n==1{print} n>=2{exit}' CHANGELOG.md > "${RUNNER_TEMP}/RELEASE_NOTES.md"
          echo "----- release notes -----"; cat "${RUNNER_TEMP}/RELEASE_NOTES.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
